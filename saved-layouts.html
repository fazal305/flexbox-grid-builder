<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox/Grid Builder | Saved Layouts</title>
    <meta
      name="description"
      content="Browse, search, and filter your saved Flexbox and Grid layouts by name, type, or tag, then preview, duplicate, rename, delete, reopen, or export any layout."
    />
    <link rel="canonical" href="https://fazal305.github.io/flexbox-grid-builder/saved-layouts.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/flexbox-grid-builder/saved-layouts.html" />
    <meta property="og:title" content="Flexbox/Grid Builder | Saved Layouts" />
    <meta
      property="og:description"
      content="Browse, search, and filter your saved Flexbox and Grid layouts by name, type, or tag, then preview, duplicate, rename, delete, reopen, or export any layout."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flexbox/Grid Builder | Saved Layouts" />
    <meta
      name="twitter:description"
      content="Browse, search, and filter your saved Flexbox and Grid layouts by name, type, or tag, then preview, duplicate, rename, delete, reopen, or export any layout."
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/saved-layouts.css" rel="stylesheet" />
  </head>
  <body data-page="saved">
    <div class="app-shell">
      <main class="app-main">
        <header class="page-header">
          <div>
            <p class="page-kicker">Saved workspace library</p>
            <h1 class="page-title">Saved Layouts</h1>
            <p class="page-description">
              Search, filter, preview, duplicate, rename, delete, reopen, or
              export any saved layout.
            </p>
          </div>
        </header>

        <section class="card-panel">
          <div class="panel-inner">
            <div class="saved-toolbar">
              <div>
                <label class="form-label" for="layoutSearch"
                  >Search by name</label
                >
                <input
                  class="form-control"
                  id="layoutSearch"
                  placeholder="Search layouts"
                />
              </div>
              <div>
                <label class="form-label" for="typeFilter">Type</label>
                <select class="form-select" id="typeFilter">
                  <option value="">All types</option>
                  <option value="flex">Flexbox</option>
                  <option value="grid">Grid</option>
                </select>
              </div>
              <div>
                <label class="form-label" for="tagFilter">Tag</label>
                <select class="form-select" id="tagFilter">
                  <option value="">All tags</option>
                </select>
              </div>
            </div>
            <p class="filter-summary" id="filterSummary"></p>
            <div class="saved-layouts-grid" id="savedLayoutsGrid"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/saved-layouts.js"></script>
  </body>
</html>
